<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Food Finder</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{font-family:Arial,sans-serif;color:#17334b}*{box-sizing:border-box}body{margin:0;background:#f5f8fa}header{background:#075b85;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}header h1{font-size:23px;margin:0}header small{color:#d5effa}.layout{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 76px)}aside{overflow:auto;background:white;border-right:1px solid #ddd;padding:20px}#map{height:100%;min-height:450px}.search{display:flex;gap:8px}input,select,button{font:inherit;padding:11px;border:1px solid #b6c9d2;border-radius:8px}input{width:100%}button{cursor:pointer;background:#0874a6;color:white;border:0}button.secondary{background:#e8f2f6;color:#075b85}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters select{max-width:100%;flex:1;min-width:130px}.entry{padding:15px 0;border-bottom:1px solid #e0e8eb}.entry h3{margin:0 0 7px;color:#075b85}.entry p{margin:6px 0;line-height:1.4}.muted{color:#536b78;font-size:13px}.tag{background:#e5f4ea;color:#176537;padding:4px 8px;border-radius:12px;font-size:12px;display:inline-block}.actions{display:flex;gap:8px;margin-top:10px}.actions a{color:#086b98;font-size:14px}.notice{padding:12px;background:#fff7e3;border-radius:8px;font-size:13px;margin:12px 0}.toplinks{display:flex;gap:12px}a{color:inherit}@media(max-width:760px){.layout{display:flex;flex-direction:column-reverse;height:auto}#map{height:43vh;min-height:300px}aside{overflow:visible}header{padding:14px}header h1{font-size:18px}}</style></head><body><header><div><h1>Community Food Finder</h1><small>Find food and community support near you</small></div><div class="toplinks"><a href="#results">Locations</a></div></header><main class="layout"><aside><h2>Find food near you</h2><div class="search"><input id="search" aria-label="Town, ZIP or address" placeholder="Town, ZIP, or address"><button id="go">Search</button></div><div class="filters"><select id="type" aria-label="Program type"><option value="">All programs</option><option>Food Pantry</option><option>Mobile Pantry</option><option>Meal Program</option></select><select id="day" aria-label="Day"><option value="">Any day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><select id="radius" aria-label="Radius"><option value="5">5 miles</option><option value="10">10 miles</option><option value="25" selected>25 miles</option><option value="50">50 miles</option><option value="9999">Anywhere</option></select></div><button class="secondary" id="locate">Use my location</button> <button class="secondary" id="reset">Reset</button><div class="notice">Demo application: location data is illustrative only. Replace <code>locations.json</code> with verified program information before public launch. Hours and availability should be confirmed with providers.</div><h3 id="count">Locations</h3><div id="results" aria-live="polite"></div></aside><div id="map" role="application" aria-label="Food assistance location map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([41.6,-72.7],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const markers=L.layerGroup().addTo(map);let locations=[],center=null;const $=id=>document.getElementById(id);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function miles(a,b,c,d){const R=3958.8,toRad=x=>x*Math.PI/180,dl=toRad(c-a),dn=toRad(d-b),v=Math.sin(dl/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(v))}function render(){markers.clearLayers();const q=$('search').value.trim().toLowerCase(),type=$('type').value,day=$('day').value,radius=+$('radius').value;let matches=locations.filter(x=>(!type||x.type===type)&&(!day||(x.days||[]).includes(day))&&(!center||miles(center[0],center[1],x.lat,x.lng)<=radius)&&(!q||center||[x.name,x.town,x.zip,x.address].some(v=>String(v||'').toLowerCase().includes(q))));if(center)matches.sort((a,b)=>miles(...center,a.lat,a.lng)-miles(...center,b.lat,b.lng));$('count').textContent=`${matches.length} location${matches.length===1?'':'s'} found`;$('results').innerHTML=matches.map(x=>`<article class="entry"><h3>${escapeHTML(x.name)}</h3><span class="tag">${escapeHTML(x.type)}</span><p>${escapeHTML(x.address)}, ${escapeHTML(x.town)} ${escapeHTML(x.zip)}</p><p class="muted">${escapeHTML(x.hours||'Contact location for hours')} · ${escapeHTML((x.days||[]).join(', '))}</p>${center?`<p class="muted">${miles(...center,x.lat,x.lng).toFixed(1)} miles away (straight line)</p>`:''}<div class="actions"><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(x.address+', '+x.town+', CT '+x.zip)}">Directions ↗</a>${x.phone?`<a href="tel:${encodeURIComponent(x.phone)}">Call</a>`:''}<a href="#map" data-id="${escapeHTML(x.id)}">View on map</a></div></article>`).join('')||'<p>No matching locations. Try changing your filters or search area.</p>';matches.forEach(x=>{const marker=L.marker([x.lat,x.lng]).addTo(markers);marker.bindPopup(`<strong>${escapeHTML(x.name)}</strong><p>${escapeHTML(x.address)}</p><p>${escapeHTML(x.hours||'Confirm hours')}</p>`);x._marker=marker});if(matches.length&&!center){const bounds=L.latLngBounds(matches.map(x=>[x.lat,x.lng]));map.fitBounds(bounds.pad(.2),{maxZoom:11})}}$('results').addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(!a)return;const x=locations.find(z=>z.id===a.dataset.id);if(x){map.setView([x.lat,x.lng],14);x._marker?.openPopup()}});['type','day','radius'].forEach(id=>$(id).addEventListener('change',render));$('search').addEventListener('input',()=>{center=null;render()});$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('go').onclick=search;async function search(){const q=$('search').value.trim();if(!q){center=null;render();return}const local=locations.filter(x=>[x.town,x.zip].some(v=>String(v||'').toLowerCase()===q.toLowerCase()));if(local.length){center=[local[0].lat,local[0].lng];render();map.setView(center,11);return}try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q='+encodeURIComponent(q));const data=await r.json();if(!data.length){alert('Location not found. Try a Connecticut town, ZIP, or address.');return}center=[+data[0].lat,+data[0].lon];render();map.setView(center,11)}catch(e){alert('Address search is temporarily unavailable.')}}$('locate').onclick=()=>{if(!navigator.geolocation){alert('Location services are not supported.');return}navigator.geolocation.getCurrentPosition(p=>{center=[p.coords.latitude,p.coords.longitude];$('search').value='';render();map.setView(center,11)},()=>alert('Location permission was not granted.'))};$('reset').onclick=()=>{$('search').value='';$('type').value='';$('day').value='';$('radius').value='25';center=null;render()};fetch('./locations.json').then(r=>{if(!r.ok)throw Error('Missing locations.json');return r.json()}).then(data=>{locations=data.filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lng)&&x.id);render()}).catch(e=>{$('results').textContent='Unable to load location data: '+e.message});
</script></body></html>
